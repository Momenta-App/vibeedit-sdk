<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:#16343e;overflow:hidden}
h1{font:900 9vw Arial;color:#fff;position:absolute;left:9%;top:25%;animation:slide 3s linear both}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(30vw)}}
#counter{position:absolute;bottom:10%;left:10%;color:#8effc9;font:4vw monospace}
</style><h1>Chromium owns this.</h1><p id="counter"></p><script>
window.renderFrame=async(frame,time)=>{
 if(frame===4) await new Promise(resolve=>setTimeout(resolve,90));
 document.querySelector('#counter').textContent=`frame ${frame} · ${time.toFixed(6)}`;
};
</script>
