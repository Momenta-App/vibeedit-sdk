name: VibeEdit package artifacts

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  NPM_PACKAGE_VERSION: 0.2.0-beta.1
  PYTHON_PACKAGE_VERSION: 0.2.0b1

jobs:
  portable-smoke:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          version: "0.11.6"
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              ffmpeg -version
              exit 0
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          throw "FFmpeg was not installed after three Chocolatey attempts"
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install portable dependencies
        run: |
          npm ci
          uv sync --extra test --extra effects --extra vision --extra browser
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: uv run playwright install chromium
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Run portable JavaScript checks
        run: |
          npm test
          bun typecheck
          npm run validate
      - name: Run portable Python checks
        working-directory: python
        run: uv run pytest tests -q --junitxml=../dist/source-tests.junit.xml
      - name: Smoke install built packages
        run: |
          node -e "require('fs').mkdirSync('dist/smoke', { recursive: true })"
          uv build --wheel --out-dir dist/smoke
          uv tool run --from dist/smoke/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}-py3-none-any.whl vibeedit --version
          npm pack --pack-destination dist/smoke
          npx --yes --package ./dist/smoke/vibeedit-${{ env.NPM_PACKAGE_VERSION }}.tgz vibeedit --version
          python scripts/smoke_release_artifacts.py --wheel dist/smoke/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}-py3-none-any.whl --npm dist/smoke/vibeedit-${{ env.NPM_PACKAGE_VERSION }}.tgz --output dist/smoke-proof.json

      - name: Retain platform qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qualification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/source-tests.junit.xml
            dist/smoke-proof.json
          if-no-files-found: ignore

  build-and-attest:
    timeout-minutes: 30
    needs: portable-smoke
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
      artifact-digest: ${{ steps.packages.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.release-manifest.outputs.sha256 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          version: "0.11.6"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python test environment and Chromium
        run: |
          uv sync --extra test --extra browser --extra vision
          uv run playwright install --with-deps chromium
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Validate JavaScript package and types
        run: |
          npm test
          bun typecheck
          npm run validate
      - name: Validate Python package
        working-directory: python
        run: uv run pytest tests -q
      - name: Build publishable artifacts
        run: |
          mkdir -p dist/npm dist/python
          npm pack --pack-destination dist/npm
          uv build --out-dir dist/python
      - name: Audit release archives against pinned provenance
        run: |
          python scripts/audit_release_artifacts.py \
            --wheel dist/python/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}-py3-none-any.whl \
            --sdist dist/python/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}.tar.gz \
            --npm dist/npm/vibeedit-${{ env.NPM_PACKAGE_VERSION }}.tgz \
            --output dist/archive-audit.json
      - name: Generate artifact checksums
        run: |
          python scripts/generate_release_checksums.py \
            --npm-dir dist/npm \
            --python-dir dist/python \
            --flat-output dist/SHA256SUMS \
            --tree-output dist/SHA256SUMS.tree
      - name: Prepare exact agent bootstrap assets
        id: release-manifest
        run: |
          cp skills/vibeedit-setup/scripts/setup.py dist/setup.py
          cp requirements-core.lock dist/requirements-core.lock
          python scripts/prepare_release_manifest.py \
            --wheel dist/python/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}-py3-none-any.whl \
            --sdist dist/python/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}.tar.gz \
            --npm dist/npm/vibeedit-${{ env.NPM_PACKAGE_VERSION }}.tgz \
            --source-revision "$GITHUB_SHA" --output dist/release-manifest.json
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('sha256=' + hashlib.sha256(Path('dist/release-manifest.json').read_bytes()).hexdigest() + '\n')
          PY
      - name: Attest package provenance
        if: github.event_name == 'workflow_dispatch' && !github.event.repository.private
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/**/*
      - name: Upload package artifacts
        id: packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vibeedit-${{ env.NPM_PACKAGE_VERSION }}-packages
          path: dist
          if-no-files-found: error

  canonical-archive-smoke:
    timeout-minutes: 30
    needs: build-and-attest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          version: "0.11.6"
      - name: Download the immutable canonical build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-and-attest.outputs.artifact-id }}
          path: canonical
          merge-multiple: true
          digest-mismatch: error
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              ffmpeg -version
              exit 0
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          throw "FFmpeg was not installed after three Chocolatey attempts"
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      # Do not build, sync a source environment, or pack here. Every platform
      # installs the same bytes emitted once by build-and-attest.
      - name: Verify and smoke the exact canonical release archives
        run: >-
          python scripts/smoke_release_artifacts.py
          --wheel canonical/python/vibeedit-${{ env.PYTHON_PACKAGE_VERSION }}-py3-none-any.whl
          --npm canonical/npm/vibeedit-${{ env.NPM_PACKAGE_VERSION }}.tgz
          --manifest canonical/release-manifest.json
          --manifest-sha256 ${{ needs.build-and-attest.outputs.manifest-sha256 }}
          --checksums canonical/SHA256SUMS
          --canonical-artifact-id ${{ needs.build-and-attest.outputs.artifact-id }}
          --canonical-artifact-digest ${{ needs.build-and-attest.outputs.artifact-digest }}
          --expected-python ${{ matrix.python }}
          --source-revision ${{ github.sha }}
          --output dist/canonical-smoke-proof.json
      - name: Retain canonical archive qualification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: canonical-qualification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/canonical-smoke-proof.json
            canonical/release-manifest.json
            canonical/SHA256SUMS
            canonical/SHA256SUMS.tree
          if-no-files-found: error
