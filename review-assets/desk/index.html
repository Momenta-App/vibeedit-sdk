<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VibeEdit review</title><link rel="stylesheet" href="style.css"><body><header><b>VibeEdit</b><span id="mode">Review</span><output id="status">Loading project…</output></header><main><section class="viewer"><video id="media" controls preload="metadata"></video><nav><button id="note-here">Note here</button><button id="back">← Frame</button><button id="forward">Frame →</button><label><input type="checkbox" id="loop"> Loop selection</label></nav><p id="uncertainty">Machine evidence can be incomplete. Unresolved identity remains unresolved.</p><label>Filter <input id="filter" type="search" placeholder="Text, group or status"></label><nav><button id="previous-page">Previous page</button><output id="page"></output><button id="next-page">Next page</button></nav><div id="rows"></div></section><aside><h1 id="title">Review</h1><p id="source"></p><p id="conflicts" role="alert"></p><label>Target ID<input id="target"></label><label>Text or note<textarea id="text"></textarea></label><label>Start (source µs)<input id="start" type="number" step="1"></label><label>End (source µs)<input id="end" type="number" step="1"></label><label>Person link to confirm (blank = unresolved)<input id="person"></label><label>Portrait registered source ID<input id="portrait"></label><label>Group members (comma separated)<input id="members"></label><label>Cloud library ID (optional)<input id="library"></label><label>Expected cloud library revision<input id="library-revision"></label><nav><button id="save">Save correction</button><button id="assign-person">Confirm person link / unresolved</button><button id="delete">Delete</button><button id="undo">Undo last</button></nav><nav><button id="merge">Merge</button><button id="split">Split</button><button id="restore">Restore</button><button id="export">Export revisions</button></nav><p>Face library changes stay pending until the cloud authority acknowledges them. Saving a note does not certify a render or a word boundary.</p><div id="history"></div></aside></main><script type="module" src="app.js"></script></body></html>
