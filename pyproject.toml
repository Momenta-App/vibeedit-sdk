[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "vibeedit"
version = "0.2.0b2"
description = "VibeEdit-owned video composition, motion, rendering, and verification library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Attention Engine Inc." }]
dependencies = ["jsonschema>=4.23,<5"]
keywords = ["video", "editing", "motion-graphics", "ffmpeg", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
browser = ["playwright==1.61.0"]
effects = ["numpy==2.4.6; python_version == '3.11'", "numpy==2.5.1; python_version >= '3.12'", "pillow==11.3.0"]
vision = ["numpy==2.4.6; python_version == '3.11'", "numpy==2.5.1; python_version >= '3.12'", "pillow==11.3.0", "opencv-python-headless==4.13.0.92", "onnxruntime==1.27.0; sys_platform != 'darwin' or platform_machine != 'x86_64'"]
sam = ["numpy==2.4.6; python_version == '3.11'", "numpy==2.5.1; python_version >= '3.12'", "pillow==11.3.0", "opencv-python-headless==4.13.0.92", "torch==2.12.0", "torchvision==0.27.0", "hydra-core==1.3.2", "iopath==0.1.10", "tqdm==4.67.1"]
all = [
  "playwright==1.61.0",
  "numpy==2.4.6; python_version == '3.11'",
  "numpy==2.5.1; python_version >= '3.12'",
  "pillow==11.3.0",
  "opencv-python-headless==4.13.0.92",
  "onnxruntime==1.27.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.12.0",
  "torchvision==0.27.0",
  "hydra-core==1.3.2",
  "iopath==0.1.10",
  "tqdm==4.67.1",
]
test = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
vibeedit = "vibeedit.cli:main"

[project.urls]
Homepage = "https://vibeedit.com"
Repository = "https://github.com/Momenta-App/vibeedit-sdk"
Issues = "https://github.com/Momenta-App/vibeedit-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/src/vibeedit", "python/src/vibeedit_media"]

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/node_modules/**", "**/__pycache__", "**/*.pyc", "/browser-renderer/build", "/browser-renderer/surface-bridge/target", "/browser-renderer/evidence", "/browser-renderer/examples/corpus/media"]

[tool.hatch.build.targets.wheel.force-include]
"browser-renderer/host" = "vibeedit/data/browser-renderer/host"
"browser-renderer/surface-bridge/src" = "vibeedit/data/browser-renderer/surface-bridge/src"
"browser-renderer/surface-bridge/Cargo.toml" = "vibeedit/data/browser-renderer/surface-bridge/Cargo.toml"
"browser-renderer/surface-bridge/Cargo.lock" = "vibeedit/data/browser-renderer/surface-bridge/Cargo.lock"
"browser-renderer/surface-bridge/build.rs" = "vibeedit/data/browser-renderer/surface-bridge/build.rs"
"review-assets" = "vibeedit/data/review-assets"
"companion" = "vibeedit/data/companion"
"schema" = "vibeedit/data/schema"
"catalog" = "vibeedit/data/catalog"
"skills" = "vibeedit/data/skills"
"site" = "vibeedit/data/site"
"examples" = "vibeedit/data/examples"
"runtime-models" = "vibeedit/data/runtime-models"
"apple-vision-runner" = "vibeedit/data/apple-vision-runner"
"SBOM.spdx.json" = "vibeedit/data/SBOM.spdx.json"
"THIRD_PARTY_NOTICES.md" = "vibeedit/data/THIRD_PARTY_NOTICES.md"
"requirements-core.lock" = "vibeedit/data/requirements-core.lock"
"README.md" = "vibeedit/data/README.md"
"docs/PROJECTS.md" = "vibeedit/data/docs/PROJECTS.md"
"docs/MODELS.md" = "vibeedit/data/docs/MODELS.md"
"docs/COMPANION.md" = "vibeedit/data/docs/COMPANION.md"
"docs/MYRIOGRAPH.md" = "vibeedit/data/docs/MYRIOGRAPH.md"
"docs/OPERATIONS.md" = "vibeedit/data/docs/OPERATIONS.md"
"docs/SECURITY.md" = "vibeedit/data/docs/SECURITY.md"
"docs/SKILLS.md" = "vibeedit/data/docs/SKILLS.md"
"docs/HTML_MOTION_RUNTIME.md" = "vibeedit/data/docs/HTML_MOTION_RUNTIME.md"
"docs/PYTHON_EFFECTS_TRANSITIONS.md" = "vibeedit/data/docs/PYTHON_EFFECTS_TRANSITIONS.md"

[tool.hatch.build.targets.sdist]
include = [
  "/browser-renderer",
  "/python",
  "/scripts",
  "/schema",
  "/catalog",
  "/skills",
  "/site",
  "/examples",
  "/runtime-models",
  "/review-assets",
  "/companion",
  "/apple-vision-runner",
  "/docs",
  "/LICENSE.md",
  "/SBOM.spdx.json",
  "/THIRD_PARTY_NOTICES.md",
  "/README.md",
  "/requirements-core.lock",
  "/package.json",
]

exclude = ["/docs/launch", "/companion/node_modules", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
